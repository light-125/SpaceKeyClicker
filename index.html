        let score = Number(localStorage.getItem('score'));
        const reload = () => { scoredis.textContent = score };
        reload(); 
        let isPressing = false;
        const waitForRelease = () => {
            return new Promise((resolve) => {
                const handleKeyUp = (e) => {
                    if (e.key === ' ') {
                        document.removeEventListener('keyup', handleKeyUp);
                        resolve();
                    }
                };
                document.addEventListener('keyup', handleKeyUp);
            });
        };
        document.addEventListener('keydown', async (e) => {
            if (e.key === ' ') {
                e.preventDefault(); 
                if (!isPressing) {
                    exprosive.currentTime = 0;
                    exprosive.play();
                    isPressing = true;
                    score++;
                    localStorage.setItem('score', score);
                    reload();
                    await waitForRelease();
                    isPressing = false;
                }
            }
        });
        resetBtn.addEventListener('click', () => {
            const firstConfirm = window.confirm('本当にスコアをリセットしますか？');
            if (firstConfirm) {
                const secondConfirm = window.confirm('本当に、本当に初期化してよろしいですか？（データは元に戻せません）');
                if (secondConfirm) {
                    score = 0;
                    localStorage.setItem('score', score);
                    reload();
                    alert('スコアをリセットしました！');
                }
            }
            resetBtn.blur();
        });
    </script>
